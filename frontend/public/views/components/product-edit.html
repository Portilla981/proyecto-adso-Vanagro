<div class="product-edit">
    <h2 class="product-edit__title">Edición de Productos</h2>
    <p class="product-edit__subtitle">
        Realiza los cambios necesarios y haz clic en <strong>Guardar cambios</strong> para actualizarlos.
    </p>

    <form action="#" method="post" class="product-edit__form" enctype="multipart/form-data">

        <!-- Nombre, unidad y precio -->
        <div class="product-edit__row">
            <label class="product-edit__label">
                Nombre del producto
                <input class="product-edit__input" type="text" placeholder="Plátano verde" required />
            </label>

            <label class="product-edit__label">
                Unidad de medida
                <select class="product-edit__select product-edit__select--unit" required>
                <option value="kg">Kilogramos</option>
                <option value="und">Unidades</option>
                <option value="lt">Litros</option>
                <option value="lb">Libras</option>
                </select>
            </label>

            <label class="product-edit__label">
                Precio por unidad
                <input class="product-edit__input" type="number" placeholder="3000" required />
            </label>
        </div>

        <!-- Descripción -->
        <div class="product-edit__row product-edit__row--full">
            <label class="product-edit__label">
                Descripción del producto
                <textarea class="product-edit__textarea" required>Plátano Verde x 1 ud</textarea>
            </label>
        </div>

        <!-- Tipo de producto -->
        <div class="product-edit__row product-edit__row--checkbox">
            <span class="product-edit__label">Tipo de producto:</span>
            <label><input type="checkbox" /> Carne</label>
            <label><input type="checkbox" checked /> Frutas</label>
            <label><input type="checkbox" /> Granos</label>
            <label><input type="checkbox" /> Lácteos</label>
            <label><input type="checkbox" /> Verduras</label>
        </div>

        <!-- Fechas -->
        <div class="product-edit__dates">
            <h3 class="product-edit__dates--title">Caducidad</h3>

            <div class="product-edit__dates--group">
                <p class="product-edit__subtitle">Fecha de elaboración</p>
                <input type="date" class="product-edit__dates--input" value="2025-05-24" required />
            </div>

            <div class="product-edit__dates--group">
                <p class="product-edit__subtitle">Fecha de vencimiento</p>
                <input type="date" class="product-edit__dates--input" value="2025-06-01" required />
            </div>
        </div>

        <!-- Imagen -->
        <!-- Imagen -->
        <div class="product-edit__image">
            <label class="product-edit__image-upload">
                <!-- <span>Imagen del producto</span> -->
                <div class="product-edit__image-preview">
                    <img src="/frontend/public/assets/products/platano_verde.png" alt="Imagen del producto" />             
                </div>
            </label>
        </div>


        <!-- Botones -->
        <div class="product-edit__actions">
            <button type="reset" class="buttons__action buttons__action--secondary" onclick="location.href='javascript:history.back()'">Cancelar</button>
            <button type="submit" class="buttons__action buttons__action--primary" onclick="location.href='javascript:history.back()'">Guardar cambios</button>
        </div>
    </form>
</div>
