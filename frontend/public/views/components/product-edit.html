<div class="product-edit">
    <h2 class="product-edit__title">Actualizar Produco</h2>

    <form action="#" method="post" class="product-edit__container" enctype="multipart/form-data">
        
        <!-- Nombre, unidad, precio, pago, método -->
        <div class="product-edit__row">
            <label class="product-edit__label">
                Nombre del producto
                <input class="product-edit__input" placeholder="Ingrese nombre del producto" required />
            </label>

            <label class="product-edit__label">
                Unidad de medida
                <select class="product-edit__select product-edit__select--unit" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="kg">Kilogramos</option>
                    <option value="lt">Litros</option>
                    <option value="lb">Libras</option>
                </select>
            </label>

            <label class="product-edit__label">
                Precio x unidad
                <input class="product-edit__input" placeholder="Ingres el precio" required />
            </label>

            <label class="product-edit__label">
                Método de envío
                <select class="product-edit__select product-edit__select--unit" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="domicilio">Domicilio</option>
                    <option value="recoger">Recoger en punto de entrega</option>
                </select>
            </label>

            <label class="product-edit__label">
                Método de pago
                    <select class="product-edit__select product-edit__select--unit" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia bancaria</option>
                    <option value="tarjeta">Tarjeta débito / crédito</option>
                </select>
            </label>
        </div>

        <!-- Descripción -->
        <label class="product-edit__label">
            Descripción del Producto
            <textarea class="product-edit__textarea" placeholder="Ingrese la descripción" required></textarea>
        </label>

        <!-- Botones -->
        <div class="beginner-button__links">
            <button type="reset" class="buttons__action--secondary" onclick="location.href='javascript:history.back()'">Cancelar</button>
            <button type="submit" class="buttons__action--primary" onclick="location.href='javascript:history.back()'">Siguiente</button>
        </div>
    </form>
</div>
