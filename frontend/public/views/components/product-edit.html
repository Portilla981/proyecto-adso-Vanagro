<div class="product-edit">
    <h2 class="product-edit__title">Edición de Productos</h2>
    <p class="product-edit__subtitle">Haga los cambios necesarios y luego dé clic en <strong>Guardar Cambios</strong> para hacer efectivos sus cambios.</p>

    <form action="#" method="post" class="product-edit__form">        
        <!-- Campos de entrada -->
        <div class="product-edit__form--container">
            <div class="product-edit__field">
                <label class="product-edit__label--row" >Nombre del producto </label>
                <input class="product-edit__input" type="text" value="Plátano Verde"  required>
            </div>

            <div class="product-edit__field">            
            <label class="product-edit__label--row">Unidad de medida </label>            
            <select class="product-edit__select" required>
                <option value="">Unidad de Medida</option>
                <option value="kg">Kilogramos</option>
                <option value="und">Unidades</option>
                <option value="lt">Litros</option>
            </select>
            </div>

            <div class="product-edit__field">
                <label class="product-edit__label--row">Precio x unidad de medida </label>
                <input class="product-edit__input" type="number" value="3000"  required>
            </div>
        
        </div>

        <div class="product-edit__textarea">            
            <label class="product-edit__label--row">Descripcion del producto</label>
            <textarea class="product-edit__textarea--row" required>Plátano Verde x 1 ud</textarea>            
        </div>

        <!-- Tipo de producto -->
        <div class="product-edit__row--checkbox">
            <span class="product-edit__label">Tipo de Producto:</span>
            <label class="product-edit__label--row"><input type="checkbox">Carne</label>
            <label class="product-edit__label--row"><input type="checkbox" checked >Frutas</label>
            <label class="product-edit__label--row"><input type="checkbox">Granos</label>
            <label class="product-edit__label--row"><input type="checkbox">Lácteos</label>
            <label class="product-edit__label--row"><input type="checkbox">Verduras</label>
        </div>

        <!-- Sección de fechas -->
        <div class="product-edit__dates">
            <h3 class="product-edit__dates--title">Caducidad</h3>
            <p class="product-edit__subtitle">Fecha de Elaboración</p>
            <input type="date" class="product-edit__input product-edit__dates--input" value="2025-05-24" required>
            <p class="product-edit__subtitle">Fecha de Vencimiento</p>
            <input type="date" class="product-edit__input product-edit__dates--input" value="2025-06-01" required>
        </div>

        <!-- Subida de imagen -->
        <div class="product-edit__image">
            <!-- <span class="product-edit__label">ID_PRODUCTO: PR987654</span> -->
            <div class="product-edit__image-upload">
                <img class="product-edit__image-preview" src="/frontend/public/assets/products/platano_verde.png" alt="Plátano Verde" >
            </div>
        </div>

        <div class="product-edit__actions">
            <!-- <div class="buttons-container"></div> -->
            <div class="buttons">
                <button class="buttons__action--primary" type="submit">
                    Guardar
                </button>
                <button class="buttons__action--secondary" type="reset">
                    Cancelar
                </button>
            </div>
        </div>



    </form>
</div>
