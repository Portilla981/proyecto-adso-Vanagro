<div class="session__login">
    <div class="session__content">

        <!-- Lado izquierdo: info con curva -->
        <div class="session__left">
            <div class="session__info">
                <h2 class="session__info-title">Bienvenido a Vanagro</h2>
                <p class="session__info-text">
                Somos el Mercado Campesino que conecta a productores y consumidores de forma directa, 
                garantizando productos frescos y apoyando al campo colombiano.
                </p>
            </div>
        </div>

        <!-- Lado derecho: formulario -->
        <div class="session__form-container">
            <h2 class="session__subtitle">Iniciar Sesión</h2>
            <form class="beginner-form" action="#" method="">
                <div class="beginner-form__credential">
                    <div class="beginner-form__info">
                        <label class="beginner-form__label">E-mail</label>
                        <input class="beginner-form__input" type="text" placeholder="usuario@example.com" required>
                    </div>

                    <div class="beginner-form__info">
                        <label class="beginner-form__label">Contraseña</label>
                        <input class="beginner-form__input" type="password" placeholder="**************" required>
                    </div>
                </div>

                <a class="begin-lost_password" href="">¿Olvidaste la contraseña?</a>
                <div class="beginner-button__links">
                    <a href="/frontend/public/views/register-user.html">
                        <button type="button" class="buttons__action buttons__action--secondary">Crear Cuenta</button>
                    </a>
                    <a href="/frontend/public/views/account-user.html">
                        <button class="buttons__action buttons__action--primary" type="button">Iniciar Sesión</button>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
