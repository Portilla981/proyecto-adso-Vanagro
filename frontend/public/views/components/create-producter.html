<div class="form-register">
    <h2 class="form-register __title">Registro como productor</h2>

    <form class="form-register__form" action="">

        <div class="form-register__identification">
            <div class="form-register__info">
                <p class="form-register__label" >Id:</p>
                <p class="form-register__label">Nombre del Usuario</p>
                <p class="form-register__label">Identificación</p>
                <p class="form-register__label">Ubicación:</p>
                <p class="form-register__label">Teléfono:</p>
                <p class="form-register__label">Dirección:</p>
                <p class="form-register__label">Ciudad:</p>
            </div>

            <div class="form-register__photo" placeholder="Inserte foto de su finca">
                <p class="form-register__label-farm">Foto de su finca</p>
                <input class="form-register__file-farm" type="file">
            </div>
        </div>



        <div class="form-register__container">
            <div class="form-register__producter-location">


                <div class="form-register__fields-farm">
                    <input class="form-register__input" type="text" placeholder="Ingrese nombre de la finca">
                    <input class="form-register__input" type="text" placeholder="Ingrese nombre de la vereda">

                    <select class="form-register__select" name="departamento">
                        <option value="">Seleccione un departamento</option>
                        <option value="caldas">Caldas</option>
                        <option value="quindio">Quindío</option>
                        <option value="risaralda">Risaralda</option>
                    </select>

                    <select class="form-register__select" name="municipio" >
                        <!-- <option value="pereira">Pereira</option> -->
                        <option value="">Seleccione un municipio</option>                        
                    </select>
                </div>

                <div class="form-register__location">
                    <p class="form-register__label" >Ubicación en el mapa</p>
                    <div class="form-register__map">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3949.303573490634!2d-75.6959316241372!3d4.813611643326024!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3f9a5e9b4f4d7f%3A0x8c6e6c5e6c5e6c5e!2sPereira%2C%20Risaralda%2C%20Colombia!5e0!3m2!1ses-419!2sus!4v1696356789012!5m2!1ses-419!2sus"
                            width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>

        </div>
        <div class="form-register__actions">
            <a href="">
                <button type="button" class="buttons__action--primary  btn-crear-producter">Crear Productor</button>
            </a>
            <a href="">
                <button type="button" class="buttons__action--secondary  btn-cancelar-producter">Cancelar</button>
            </a>
        </div>

    </form>

</div>
