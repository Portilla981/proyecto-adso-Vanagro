<div class="product-form">
    <h2 class="product-edit__title">Creación de Productos</h2>

    <form action="#" method="post" class="product-edit__container" enctype="multipart/form-data">
        
        <!-- Nombre, unidad, precio, pago, método -->
        <div class="product-form__row">
        <label class="product-form__label">
            Nombre del producto
            <input class="product-form__input" placeholder="Ingrese nombre del producto" required />
        </label>

        <label class="product-form__label">
            Unidad de medida
            <select class="product-form__select product-form__select--unit" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="kg">Kilogramos</option>
            <option value="lt">Litros</option>
            <option value="lb">Libras</option>
            </select>
        </label>

        <label class="product-form__label">
            Precio x unidad
            <input class="product-form__input" placeholder="Ingres el precio" required />
        </label>

        <label class="product-form__label">
            Método de envío
            <select class="product-form__select product-form__select--unit" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="domicilio">Domicilio</option>
            <option value="recoger">Recoger en punto de entrega</option>
            </select>
        </label>

        <label class="product-form__label">
            Método de pago
            <select class="product-form__select product-form__select--unit" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia bancaria</option>
            <option value="tarjeta">Tarjeta débito / crédito</option>
            </select>
        </label>
        </div>

        <!-- Descripción -->
        <label class="product-form__label">
        Descripción del Producto
        <textarea class="product-form__textarea" placeholder="Ingrese la descripción" required></textarea>
        </label>

        <!-- Tipo de producto -->
        <div class="product-form__row product-form__row--checkbox">
        <span class="product-form__label">Tipo de Producto:</span>
        <label><input type="checkbox" /> Carnes</label>
        <label><input type="checkbox" /> Frutas</label>
        <label><input type="checkbox" /> Granos</label>
        <label><input type="checkbox" /> Lácteos</label>
        <label><input type="checkbox" /> Verduras</label>
        </div>

        <!-- Fechas -->
        <div class="product-form__dates">
        <h3 class="product-form__dates-title">Caducidad</h3>

        <div>
            <p class="product-form__label">Fecha de Elaboración</p>
            <input type="date" class="product-form__dates-input" required/>
        </div>

        <div>
            <p class="product-form__label">Fecha de Vencimiento</p>
            <input type="date" class="product-form__dates-input" required/>
        </div>
        </div>

        <!-- Imagen -->
        <div class="product-form__image">
        <label class="product-form__image-upload">
            <!-- <span>Imagen del producto</span> -->
            <div class="product-form__image-preview">
            <img src="/frontend/public/assets/products/platano_verde.png" alt="Imagen del producto" />
            </div>
        </label>
        </div>

        <!-- Botones -->
        <div class="product-edit__actions">
            <button type="reset" class="buttons__action buttons__action--secondary" onclick="location.href='javascript:history.back()'">Cancelar</button>
            <button type="submit" class="buttons__action buttons__action--primary" onclick="location.href='javascript:history.back()'">Crear Producto</button>
        </div>
    </form>
</div>
