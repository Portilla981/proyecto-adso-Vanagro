<div class="profile__container">

  <!-- Portada con leyenda -->
  <div class="profile__hero">
    <div class="profile__legend">
      <h2 class="profile__role">CLIENTE</h2>
      <p class="profile__message">
        ¡Tu visita nos alegra el día! Gracias por apoyar a nuestros campesinos y por ser parte de este mercado con alma rural.
      </p>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="profile__content">

    <!-- Columna izquierda: datos del productor -->
    <div class="profile__info">
        <img class="profile__avatar" src="/frontend/public/assets/vanagro/avatar.png" alt="Foto del productor">
        <h3 class="profile__name">Johan David Portilla Zambrano</h3>
        <p class="profile__joined">Se unió en 2025</p>
        <p class="profile__detail"><strong>UBICACIÓN:</strong> Marsella, Risaralda</p>
        <p class="profile__detail"><strong>CORREO:</strong> johandp@gmail.com</p>
        <p class="profile__detail"><strong>TELÉFONO:</strong> 3054331178</p>
        <div class="account-user__button">
          <!-- <a href="/frontend/public/views/index_vanagro.html">
                <button class="buttons__action--secondary account-user__button--close" type="submit">Cerrar
                    Sesión</button>
            </a> -->
          <a href="/frontend/public/views/edit-producter.html">
              <button class="buttons__action buttons__action--primary" type="submit">Editar Perfil</button>
          </a>
        </div>
    </div>

    <!-- Columna derecha: opciones -->
    <div class="profile__actions">
      <button class="profile__action">
        <ion-icon name="eye-outline"></ion-icon>
        <span>Ver Productos</span>
      </button>
      <button class="profile__action">
        <ion-icon name="bag-add-outline"></ion-icon>
        <span>Compras/Pedidos</span>
      </button>
      <button class="profile__action">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>Ver Eventos</span>
      </button>
      <button class="profile__action">
        <ion-icon name="document-text-outline"></ion-icon>
        <span>Reportes</span>
      </button>
      <button class="profile__action">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Ajustes</span>
      </button>
    </div>
  </div>
</div>
