<div class="form-register">
    <h2 class="form-register __title">Registro de Usuarios</h2>

    <p class="form-register__label">Id:</p>

    <div class="form-register__block">
        <form action="#" method="" class="form-register__add">

            <div class="form-register__group">
                <label class="form-register__label">Nombres
                    <input class="form-register__input" type="text" placeholder="Ingrese sus nombres" />
                </label>
                <label class="form-register__label">Apellidos
                    <input class="form-register__input" type="text" placeholder="Ingrese sus apellidos">
                </label>
            </div>

            <div class="form-register__group">
                <label class="form-register__label">Tipo de documento
                    <select class="form-register__input">
                        <option>Cédula</option>
                        <option>Tarjeta de Identidad</option>
                        <option>Pasaporte</option>
                    </select>
                </label>
                <label class="form-register__label">Número de identificación
                    <input class="form-register__input" type="number" placeholder="Ingrese el numero">
                </label>
            </div>

            <div class="form-register__group">
                <label class="form-register__label">Departamento
                    <select class="form-register__input">
                        <option>Risaralda</option>
                        <option>Caldas</option>
                        <option>Quindío</option>
                    </select>
                </label>
                <label class="form-register__label">Municipio
                    <select class="form-register__input">
                        <option>Marsella</option>
                        <option>Apía</option>
                        <option>Balboa</option>
                        <option>Belén de Umbría</option>
                        <option>Dosquebradas</option>
                        <option>Guática</option>
                        <option>La Celia</option>
                        <option>La Virginia</option>
                        <option>Mistrató</option>
                        <option>Pereira</option>
                        <option>Pueblo Rico</option>
                        <option>Quinchía</option>
                        <option>Santa Rosa de Cabal</option>
                        <option>Santuario</option>
                    </select>
                </label>
            </div>

            <div class="form-register__group">
                <label class="form-register__label">Dirección
                    <input class="form-register__input" type="text" placeholder="Ingrese su dirección">
                </label>
                <label class="form-register__label">Correo Electrónico
                    <input class="form-register__input" type="email" placeholder="Ingrese su correo">
                </label>
            </div>

            <div class="form-register__group">
                <label class="form-register__label">Teléfono principal
                    <input class="form-register__input" type="tel" placeholder="Ingrese su teléfono">
                </label>
                <label class="form-register__label">Teléfono secundario
                    <input class="form-register__input" type="tel" placeholder="Ingrese otro teléfono">
                </label>
            </div>

            <div class="form-register__group">
                <label class="form-register__label">Contraseña
                    <input class="form-register__input" type="password" placeholder="">
                </label>
                <label class="form-register__label">Confirmar contraseña
                    <input class="form-register__input" type="password" placeholder="">
                </label>
            </div>

            <div class="form-register__actions">
                <a href="/frontend/public/views/producter-profile.html">
                    <button type="button" class="buttons__action--primary btn-save">Guardar Cambios</button>
                </a>
                <button type="button" class="buttons__action--secondary btn-cancel"
                    onclick="cancelarFormulario()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
