<div class="product-form">
    <h2 class="product-form__title">Creación de Productos</h2>
    <p class="product-form__subtitle">Completa los campos requeridos y haz clic en Crear producto</p>

    <form action="#" method="post" class="product-form__container">
        
        <div class="product-form__row">
            <div class="product-form__name">

            <label class="form-register__label">Nombre del producto
                    <input class="form-register__input" type="text" placeholder="Ingrese el nombre del producto" />
                </label> 
            </div> 
            <div class="product-form__quantity">
            <label class="form-register__label">Unidad de medida
                    <select class="form-register__input">
                        <option value="kg">Kilogramos</option>
                        <option value="und">Unidades</option>
                        <option value="lt">Litros</option>
                    </select>
            </label> 
            <label class="form-register__label">Precio x unidad
                    <input class="form-register__input" type="number" placeholder="Ingrese el valor" />
                </label>
                </div>
        </div>

        <textarea placeholder="Descripción del producto" class="product-form__textarea" required></textarea>
        
        <!-- Tipo de producto -->
        <div class="product-form__row product-form__row--checkbox">
            <span class="product-form__label">Tipo de Producto:</span>
            <label class="product-form__row--label"><input type="checkbox">Carne</label>
            <label class="product-form__row--label"><input type="checkbox">Frutas</label>
            <label class="product-form__row--label"><input type="checkbox">Granos</label>
            <label class="product-form__row--label"><input type="checkbox">Lácteos</label>
            <label class="product-form__row--label"><input type="checkbox">Verduras</label>
        </div>

        <!-- Sección de fechas -->
        <div class="product-form__dates">
            <h3 class="product-form__dates--title">Caducidad</h3>
            <p class="product-form__dates--subtitle">Fecha de Elaboración</p>
            <input type="date" class="product-form__input product-form__dates--input" placeholder="Fecha Elaboración" required>
            <p class="product-form__dates--subtitle">Fecha de Vencimiento</p>
            <input type="date" class="product-form__input product-form__dates--input" placeholder="Fecha Vencimiento" required>
        </div>

        <!-- Subida de imagen -->
        <div class="product-form__image">
            <div class="product-form__image--upload">
                <span>Foto</span>
            </div>
        </div>

        <!-- Botones -->
        <div class="product-form__actions">
            <!-- <div class="buttons-container"></div> -->
            <div class="buttons">
                <button class="buttons__action--primary" type="submit">
                    Guardar
                </button>
                <button class="buttons__action--secondary" type="reset">
                    Cancelar
                </button>
            </div>
        </div>

    </form>
</div>
